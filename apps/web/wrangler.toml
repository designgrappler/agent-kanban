name = "agent-kanban"
main = "./worker/index.ts"
compatibility_date = "2026-04-13"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_HOSTS = "localhost:5173"
# Secrets for local dev go in .dev.vars (gitignored):
#   AUTH_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET

[limits]
cpu_ms = 1000

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/.well-known/*", "/agents/*.gpg", "/share/*"]

[[d1_databases]]
binding = "DB"
database_name = "agent-kanban-db"
database_id = "13cdf435-a99c-4744-9eca-9ed22b232581"
migrations_dir = "migrations"
